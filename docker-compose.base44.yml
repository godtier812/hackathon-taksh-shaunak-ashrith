# Base44 development environment — runs the Next.js frontend and the Electron
# backend (with a virtual display) from source, both with live reload.
services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      # Point the dashboard at the backend's public API URL (port 4317).
      - NEXT_PUBLIC_MINDTRACE_API=https://4317-${BASE44_PUBLIC_HOST_SUFFIX}/api
      # Polling-based file watching so live reload fires through the bind mount.
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  backend:
    build:
      context: .
      dockerfile: docker-compose.backend.Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "4317:4317"
    environment:
      # Bind the API to all interfaces so the proxy can reach it.
      - MINDTRACE_API_HOST=0.0.0.0
      # Allow the frontend's public origin to call the API.
      - MINDTRACE_ALLOWED_ORIGINS=*
    command: sh -c "npm install && xvfb-run -a ./node_modules/.bin/electron-vite dev -- --no-sandbox"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4317/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

volumes:
  web_node_modules:
  backend_node_modules:
