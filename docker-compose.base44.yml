services:
  web:
    image: node:22
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - web_node_modules:/app/frontend/node_modules
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_PUBLIC_HOST_SUFFIX}
    restart: unless-stopped

volumes:
  web_node_modules:
